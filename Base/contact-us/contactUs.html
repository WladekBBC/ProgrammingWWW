<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prosty szkielet MPA – podstrona" />
    <meta name="author" content="Base Template" />
    <link rel="icon" type="image/jpeg" href="../content/faviconOF.jpg" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="../style.css" />
    <script defer src="../script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">Main</a>
        <button
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Toggle navigation"
        >
          ☰
        </button>
        <nav id="site-nav" class="site-nav">
          <a href="../index.html" class="nav-link" data-nav>Home</a>
          <a
            href="./contactUs.html"
            class="nav-link"
            data-nav
            aria-current="page"
            >Example page</a
          >
        </nav>
      </div>
    </header>

    <main class="container">
      <article class="card">
        <h1>Strona kontaktowa</h1>
        <form
          action="https://webdevbasics.net/scripts/demo.php"
          method="post"
          name="fm"
        >
          <fieldset class="form-fieldset" id="fm">
            <legend>Formularz kontaktowy</legend>

            <label for="name" class="form-label">Imię</label>
            <input
              type="text"
              class="form-input"
              id="name"
              name="name"
              placeholder="Jan"
              required
            /><br />
            <label for="surname" class="form-label">Nazwisko</label>
            <input
              type="text"
              class="form-input"
              id="surname"
              name="surname"
              placeholder="Kowalski"
              required
            /><br />
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-input"
              id="email"
              name="email"
              placeholder="jan.kowalski@example.com"
              required
            />
            <br />
            <label for="phone" class="form-label">Telefon</label>
            <input
              type="tel"
              class="form-input"
              id="phone"
              name="phone"
              placeholder="1234567890"
              required
            />
            <br />
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-input"
              id="message"
              name="message"
              placeholder="Wiadomość"
              required
            ></textarea>
            <br />
            <button class="form-button" type="submit">Send</button>
            <button class="form-button" type="reset">Reset</button>
          </fieldset>
        </form>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>© Vladyslav Berezhnyi</small>
      </div>
    </footer>
  </body>
</html>
